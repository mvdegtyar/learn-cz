<main class="main">
  <div class="content">
    <div class="button-container"
      (dragover)="onDragOver($event, 'main')"
      (drop)="onDrop($event, 'main')">
      @for (item of words; track item.word) {
      <button
        draggable="true"
        (dragstart)="onDragStart($event, item, 'main')"
        [style.background]="getColor(item.colorIdx)">
        {{ item.word }}
      </button>
      }
    </div>
    <div class="action-buttons">
      <button class="check-btn" (click)="onCheck()">Check</button>
      <button class="restart-btn" (click)="onRestart()">Restart</button>
    </div>
    <div class="panels-row">
      <div class="drop-panel"
        (dragover)="onDragOver($event, 'panel1')"
        (drop)="onDrop($event, 'panel1')">
        <div class="panel-label se-label">SE</div>
        @for (item of panel1Words; track item.word) {
          <button
            draggable="true"
            (dragstart)="onDragStart($event, item, 'panel1')"
            [style.background]="item.checkColor || getColor(item.colorIdx)">
            {{ item.word }}
          </button>
        }
      </div>
      <div class="drop-panel"
        (dragover)="onDragOver($event, 'panel2')"
        (drop)="onDrop($event, 'panel2')">
        <div class="panel-label si-label">SI</div>
        @for (item of panel2Words; track item.word) {
          <button
            draggable="true"
            (dragstart)="onDragStart($event, item, 'panel2')"
            [style.background]="item.checkColor || getColor(item.colorIdx)">
            {{ item.word }}
          </button>
        }
      </div>
    </div>
  </div>
</main>
